plugins {
    id 'com.android.application'
}

android {
    namespace 'com.semaatlasi.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.semaatlasi.app"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        semaInternal {
            storeFile file('../keystore/sema-dev.p12')
            storePassword 'SemaAtlasDev2026!'
            keyAlias 'sema-atlasi'
            keyPassword 'SemaAtlasDev2026!'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.semaInternal
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.semaInternal
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'io.github.cosinekitty:astronomy:2.1.19'
}
