name: Build Matrix Evreni V2 Real Data Stable

on:
  workflow_dispatch:
  push:
    branches: [ "matrix-evreni-v2-realdata" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apk-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='com.matrixevreni.v2'" apk-badging.txt
          grep "versionCode='200'" apk-badging.txt
          grep "targetSdkVersion:'35'" apk-badging.txt
          grep "android.permission.INTERNET" <("$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$APK")

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matrix-Evreni-V2-RealData-Stable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
