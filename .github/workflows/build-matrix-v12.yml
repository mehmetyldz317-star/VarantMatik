name: Build Matrix Evreni V1.2

on:
  workflow_dispatch:
  push:
    branches: [ "matrix-evreni-v12-webview" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Validate APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "package: name='com.matrixevreni.app'" apk-badging.txt
          grep "sdkVersion:'24'" apk-badging.txt
          grep "targetSdkVersion:'37'" apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Matrix-Evreni-V1.2-validated-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
