name: Build VarantMatik V8 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Kaynak projeyi aç
        shell: bash
        run: |
          rm -rf .ci_build
          mkdir -p .ci_build
          unzip -q VarantMatik_V8_Master_Source_Validated.zip -d .ci_build
          test -f .ci_build/VarantMatik_V8_Master/settings.gradle

      - name: Analiz motoru testlerini çalıştır
        working-directory: .ci_build/VarantMatik_V8_Master
        run: bash tools/run_core_tests.sh

      - name: APK oluştur
        working-directory: .ci_build/VarantMatik_V8_Master
        run: gradle :app:assembleDebug --stacktrace

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: VarantMatik-V8-debug-apk
          path: .ci_build/VarantMatik_V8_Master/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
