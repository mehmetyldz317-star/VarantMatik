name: Build HisseLab V11 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: HisseLab V9 kaynak projeyi birlestir
        shell: bash
        run: |
          rm -rf .ci_build source.tar.xz source.b64 v10.patch v10.patch.xz v10.patch.xz.b64 v11.patch v11.patch.xz v11.patch.xz.b64 stable.jks.b64
          mkdir -p .ci_build
          cat ci_source/part*.b64 > source.b64
          test "$(wc -c < source.b64)" -eq 39360
          base64 -d source.b64 > source.tar.xz
          tar -xJf source.tar.xz -C .ci_build
          test -f .ci_build/HisseLab_V9_Master/settings.gradle.kts

      - name: V10 karar motoru yamasini uygula
        shell: bash
        run: |
          cat v10_patch/part*.b64 > v10.patch.xz.b64
          test "$(wc -c < v10.patch.xz.b64)" -eq 15384
          base64 -d v10.patch.xz.b64 > v10.patch.xz
          xz -dc v10.patch.xz > v10.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v10.patch

      - name: V11 guclendirme yamasini ve sabit imzayi uygula
        shell: bash
        run: |
          cat v11_patch/part*.b64 > v11.patch.xz.b64
          test "$(wc -c < v11.patch.xz.b64)" -eq 21120
          base64 -d v11.patch.xz.b64 > v11.patch.xz
          xz -dc v11.patch.xz > v11.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v11.patch
          base64 -d ../../v11_patch/stable-key.b64 > hisselab-stable.jks
          grep -q 'versionName = "11.0"' app/build.gradle.kts

      - name: Analiz motoru ve regresyon testlerini calistir
        working-directory: .ci_build/HisseLab_V9_Master
        run: bash tools/run_core_tests.sh

      - name: APK olustur
        working-directory: .ci_build/HisseLab_V9_Master
        run: gradle :app:assembleDebug --stacktrace

      - name: APK imzasini dogrula
        working-directory: .ci_build/HisseLab_V9_Master
        run: |
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: HisseLab-V11-stable-apk
          path: .ci_build/HisseLab_V9_Master/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
