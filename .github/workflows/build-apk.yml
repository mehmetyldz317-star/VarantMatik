name: Build HisseLab V19 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Tabani yeniden kur ve V19 kapanis teyidini uygula
        shell: bash
        run: |
          rm -rf .ci_build source.* v10.patch* v11.patch* v12.patch* v13.patch* v14.patch* v15.patch* v16.patch* v17.patch* v18.patch*
          mkdir -p .ci_build

          cat ci_source/part*.b64 > source.b64
          test "$(wc -c < source.b64)" -eq 39360
          base64 -d source.b64 > source.tar.xz
          tar -xJf source.tar.xz -C .ci_build

          cat v10_patch/part*.b64 > v10.patch.xz.b64
          test "$(wc -c < v10.patch.xz.b64)" -eq 15384
          base64 -d v10.patch.xz.b64 > v10.patch.xz
          xz -dc v10.patch.xz > v10.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v10.patch
          cd ../..

          cat v11_patch/part0*.b64 > v11.patch.xz.b64
          test "$(wc -c < v11.patch.xz.b64)" -eq 21120
          base64 -d v11.patch.xz.b64 > v11.patch.xz
          xz -dc v11.patch.xz > v11.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v11.patch
          base64 -d ../../v11_patch/stable-key.b64 > hisselab-stable.jks
          cd ../..

          cat v12_patch/part*.b64 > v12.patch.xz.b64
          test "$(wc -c < v12.patch.xz.b64)" -eq 11384
          base64 -d v12.patch.xz.b64 > v12.patch.xz
          xz -dc v12.patch.xz > v12.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v12.patch
          patch -p1 < ../../v12_patch/testfix.patch
          cd ../..

          cat v13_patch/part*.b64 > v13.patch.xz.b64
          test "$(wc -c < v13.patch.xz.b64)" -eq 27664
          base64 -d v13.patch.xz.b64 > v13.patch.xz
          xz -dc v13.patch.xz > v13.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v13.patch
          cd ../..

          cat v14_patch/part*.b64 > v14.patch.xz.b64
          test "$(wc -c < v14.patch.xz.b64)" -eq 25960
          base64 -d v14.patch.xz.b64 > v14.patch.xz
          xz -dc v14.patch.xz > v14.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v14.patch
          cd ../..

          cat v15_patch/part*.b64 > v15.patch.xz.b64
          test "$(wc -c < v15.patch.xz.b64)" -eq 20364
          base64 -d v15.patch.xz.b64 > v15.patch.xz
          xz -dc v15.patch.xz > v15.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v15.patch
          cd ../..

          cat v16_patch/part*.b64 > v16.patch.xz.b64
          test "$(wc -c < v16.patch.xz.b64)" -eq 29032
          base64 -d v16.patch.xz.b64 > v16.patch.xz
          xz -dc v16.patch.xz > v16.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v16.patch
          cd ../..

          cat v17_patch/part*.b64 > v17.patch.xz.b64
          test "$(wc -c < v17.patch.xz.b64)" -eq 24876
          base64 -d v17.patch.xz.b64 > v17.patch.xz
          xz -dc v17.patch.xz > v17.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v17.patch
          cd ../..

          cat v18_patch/part*.b64 > v18.patch.xz.b64
          test "$(wc -c < v18.patch.xz.b64)" -eq 22416
          base64 -d v18.patch.xz.b64 > v18.patch.xz
          xz -dc v18.patch.xz > v18.patch
          cd .ci_build/HisseLab_V9_Master
          patch -p1 < ../../v18.patch
          patch -p1 < ../../v18_hotfix.patch
          patch -p1 < ../../v19_confirmation.patch
          grep -q 'versionName = "19.0"' app/build.gradle.kts
          grep -q 'versionCode = 19' app/build.gradle.kts

      - name: V19 kapanis teyidi ve walk-forward regresyon testleri
        working-directory: .ci_build/HisseLab_V9_Master
        run: bash tools/run_core_tests.sh

      - name: APK olustur
        working-directory: .ci_build/HisseLab_V9_Master
        run: gradle :app:assembleDebug --stacktrace

      - name: Sabit imzayi dogrula
        working-directory: .ci_build/HisseLab_V9_Master
        run: /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Kaynak paketi hazirla
        working-directory: .ci_build/HisseLab_V9_Master
        shell: bash
        run: |
          rm -f hisselab-stable.jks
          tar -czf ../../HisseLab_V19_Source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: HisseLab-V19-stable-apk
          path: .ci_build/HisseLab_V9_Master/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: HisseLab-V19-source
          path: HisseLab_V19_Source.tar.gz
          if-no-files-found: error
