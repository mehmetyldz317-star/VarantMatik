name: Build Sema Atlasi APK

on:
  push:
    branches:
      - sema-atlasi-build-v1
    paths:
      - 'sema-android/**'
      - '.github/workflows/sema-atlasi-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Install Android 35
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build naked-eye star catalog
        working-directory: sema-android
        run: |
          python3 - <<'PY'
          import csv, io, os, shutil, urllib.request

          url = "https://raw.githubusercontent.com/astronexus/HYG-Database/main/hyg/CURRENT/hygdata_v41.csv"
          assets = "app/src/main/assets"
          os.makedirs(assets, exist_ok=True)
          out_path = os.path.join(assets, "stars.dat")
          fallback = os.path.join(assets, "fallback_stars.dat")

          def clean(s):
              return (s or "").replace("\t", " ").replace("\r", " ").replace("\n", " ").strip()

          try:
              req = urllib.request.Request(url, headers={"User-Agent":"SemaAtlasiBuild/1.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  text = io.TextIOWrapper(response, encoding="utf-8", newline="")
                  reader = csv.DictReader(text)
                  rows = []
                  for idx, row in enumerate(reader):
                      try:
                          mag = float(row.get("mag") or "99")
                          ra = float(row.get("ra") or "")
                          dec = float(row.get("dec") or "")
                      except Exception:
                          continue
                      if mag > 6.0:
                          continue
                      proper = clean(row.get("proper"))
                      bf = clean(row.get("bf"))
                      hip = clean(row.get("hip"))
                      hyg_id = clean(row.get("id"))
                      name = proper or bf or (("HIP " + hip) if hip else ("HYG " + (hyg_id or str(idx))))
                      if name.strip().lower() == "sol":
                          continue
                      con = clean(row.get("con"))
                      dist_ly = ""
                      try:
                          pc = float(row.get("dist") or "nan")
                          if pc > 0 and pc < 10000:
                              dist_ly = f"{pc * 3.26156:.2f}"
                      except Exception:
                          pass
                      sid = ("h" + hip) if hip else ("hyg" + (hyg_id or str(idx)))
                      def num(field):
                          try:
                              v = float(row.get(field) or "nan")
                              return f"{v:.12g}" if v == v else ""
                          except Exception:
                              return ""
                      rows.append((sid, name, "", con, f"{ra:.7f}", f"{dec:.7f}", f"{mag:.3f}", dist_ly,
                                   num("x"), num("y"), num("z"), num("vx"), num("vy"), num("vz")))

              rows.sort(key=lambda r: float(r[6]))
              with open(out_path, "w", encoding="utf-8", newline="") as f:
                  f.write("# id\tname\ttr\tcon\tra_hours\tdec_deg\tmag\tdistance_ly\tx_pc\ty_pc\tz_pc\tvx_pcyr\tvy_pcyr\tvz_pcyr\n")
                  for r in rows:
                      f.write("\t".join(r) + "\n")
              print("HYG catalog stars:", len(rows))
              if len(rows) < 1000:
                  raise RuntimeError("Catalog unexpectedly small")
          except Exception as e:
              print("HYG download failed; using fallback:", e)
              shutil.copyfile(fallback, out_path)
          PY

      - name: Assemble debug APK
        working-directory: sema-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare artifact
        working-directory: sema-android
        run: |
          mkdir -p build-artifact
          cp app/build/outputs/apk/debug/app-debug.apk build-artifact/SemaAtlasi-v1.1.apk
          sha256sum build-artifact/SemaAtlasi-v1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SemaAtlasi-v1.1-APK
          path: sema-android/build-artifact/SemaAtlasi-v1.1.apk
          if-no-files-found: error
          retention-days: 7
