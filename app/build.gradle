plugins { id 'com.android.application' }

android {
    namespace 'com.mizandar.matrixevreni'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mizandar.matrixevreni'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
